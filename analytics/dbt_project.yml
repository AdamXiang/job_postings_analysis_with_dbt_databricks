# name of the dbt project
name: analytics

# profile name in dbt_profiles.yml that we set up already
profile: databricks

clean-targets:
- "target"
- "dbt_packages"

models:
  analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  analytics:
    +schema: seeds
